name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and test the Rust analyzer
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo test --locked --release --manifest-path native/Cargo.toml
          cargo build --locked --release --manifest-path native/Cargo.toml
      - name: Build, install and test the extension
        env:
          PG_MAJOR: ${{ matrix.pg }}
        run: |
          docker run -d --name kor-pg -e POSTGRES_PASSWORD=local -v "$PWD:/work" "postgres:$PG_MAJOR-trixie"
          trap 'docker rm -f kor-pg >/dev/null' EXIT
          docker exec kor-pg sh -ec 'apt-get update -qq; apt-get install -y -qq --no-install-recommends "postgresql-server-dev-$1" make gcc libc6-dev' sh "$PG_MAJOR"
          docker exec kor-pg pg_isready -h 127.0.0.1 -U postgres
          docker exec -w /work kor-pg sh -ec 'make clean && make -j2 && make install && PGUSER=postgres bash test/run.sh'
